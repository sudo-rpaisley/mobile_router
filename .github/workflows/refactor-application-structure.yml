name: Refactor application structure

on:
  push:
    branches:
      - agent/refactor-application-structure
    paths:
      - tools/refactor_app_structure.py
      - .github/workflows/refactor-application-structure.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/refactor-application-structure
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Apply structural refactor
        run: python tools/refactor_app_structure.py

      - name: Compile Python sources
        run: python -m compileall -q app.py app_support routes services scripts tests

      - name: Run tests
        run: python -m pytest -q

      - name: Commit generated refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py app_support tests/test_code_quality.py
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Extract cohesive application support modules"
          git push origin HEAD:agent/refactor-application-structure
