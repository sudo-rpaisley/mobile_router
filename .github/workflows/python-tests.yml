name: Python tests

on:
  pull_request:
  push:
    branches:
      - main
      - agent/deduplicate-shared-code

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Consolidate repeated implementations
        run: |
          python tools/consolidate_context_refresh.py
          python tools/consolidate_bluetooth_support.py
          python tools/consolidate_network_helpers.py

      - name: Commit generated consolidations
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_support routes scripts
          if git diff --cached --quiet; then
            echo "No consolidation required."
          else
            git commit -m "Consolidate repeated implementations"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Compile Python sources
        run: python -m compileall -q app.py app_support routes services scripts tests tools

      - name: Generate duplicate-code report
        run: python tools/report_duplicate_code.py

      - name: Upload duplicate-code report
        uses: actions/upload-artifact@v4
        with:
          name: duplicate-code-report
          path: duplicate_code_report.md

      - name: Run tests
        run: python -m pytest -q
