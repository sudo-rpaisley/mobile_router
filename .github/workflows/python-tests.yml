name: Python tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove temporary scratch branches
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/deduplicate-shared-code'
        shell: bash
        run: |
          for branch in \
            agent/deduplicate-shared-code-analysis \
            agent/deduplicate-shared-code-audit-temp \
            agent/deduplicate-shared-code-cleanup \
            agent/deduplicate-shared-code-do-not-use \
            agent/deduplicate-shared-code-final \
            agent/deduplicate-shared-code-unused \
            agent/deduplicate-shared-code-v2 \
            agent/deduplicate-shared-code-work
          do
            git push origin --delete "$branch" || true
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q app.py app_support routes services scripts tests tools

      - name: Generate duplicate-code report
        run: python tools/report_duplicate_code.py

      - name: Upload duplicate-code report
        uses: actions/upload-artifact@v4
        with:
          name: duplicate-code-report
          path: duplicate_code_report.md

      - name: Run tests
        run: python -m pytest -q
