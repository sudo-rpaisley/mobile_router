name: Python tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate-navigation-profile:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/navigation-cleanup' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out navigation branch
        uses: actions/checkout@v4
        with:
          ref: agent/navigation-cleanup
      - name: Apply navigation and profile migration
        run: python tools/apply_navigation_profile_migration.py
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add navigation context and account settings"
          git push origin HEAD:agent/navigation-cleanup

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q app.py app_support routes services scripts tests tools

      - name: Import application
        run: python -c "import app; print('Application imported successfully')"

      - name: Generate duplicate-code report
        run: python tools/report_duplicate_code.py

      - name: Upload duplicate-code report
        uses: actions/upload-artifact@v4
        with:
          name: duplicate-code-report-${{ runner.os }}
          path: duplicate_code_report.md

      - name: Run tests
        run: python -m pytest -q
