name: Python tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install ruff vulture radon

      - name: Compile Python sources
        run: python -m compileall -q app.py app_support routes services scripts tests tools

      - name: Generate duplicate-code report
        run: python tools/report_duplicate_code.py

      - name: Generate cleanup audit
        shell: bash
        run: |
          ruff check app.py app_support routes services scripts tests tools --output-format=concise --exit-zero > ruff-report.txt
          vulture app.py app_support routes services scripts --min-confidence 80 > vulture-report.txt || true
          radon cc app.py app_support routes services scripts -s -a > complexity-report.txt
          radon mi app.py app_support routes services scripts -s > maintainability-report.txt

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-audit
          path: |
            duplicate_code_report.md
            ruff-report.txt
            vulture-report.txt
            complexity-report.txt
            maintainability-report.txt

      - name: Run tests
        run: python -m pytest -q
