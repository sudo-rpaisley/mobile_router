name: Python tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Generate application structure report
        run: python tools/report_app_structure.py

      - name: Commit application structure report
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_structure_report.md
          if git diff --cached --quiet; then
            echo "Structure report is current."
          else
            git commit -m "Report remaining application structure"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Compile Python sources
        run: python -m compileall -q app.py app_support routes services scripts tests

      - name: Run tests
        run: python -m pytest -q
