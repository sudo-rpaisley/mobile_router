name: Apply support patch seams

on:
  push:
    branches:
      - agent/migrate-support-dependencies

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/migrate-support-dependencies

      - name: Apply provider patch seams
        run: python tools/apply_support_patch_seams.py

      - name: Validate patched sources
        run: python -m compileall -q app.py app_support routes services scripts tests tools

      - name: Commit permanent support changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_support/client_identity.py app_support/client_metadata.py app_support/client_profile.py
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Preserve client helper patch seams"
            git push origin HEAD:agent/migrate-support-dependencies
          fi
