name: Apply navigation and profile migration

on:
  push:
    branches:
      - agent/navigation-cleanup

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/navigation-cleanup
      - name: Apply migration
        run: python tools/apply_navigation_profile_migration.py
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add navigation context and account settings"
          git push origin HEAD:agent/navigation-cleanup
