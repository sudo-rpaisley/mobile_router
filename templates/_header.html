<!-- /root/flaskapp/templates/_head.html -->
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='font-awesome/css/all.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/adapters-card.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/navigation-shell.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/train-controller.css') }}">
<link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">

<script>
  (function () {
    try {
      var storedTheme = window.localStorage.getItem('theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', storedTheme || (prefersDark ? 'dark' : 'light'));
      document.documentElement.classList.toggle('user-compact-layout', {{ 'true' if app_user and app_user.preferences and app_user.preferences.compact_layout else 'false' }});
      document.documentElement.classList.toggle('user-reduced-motion', {{ 'true' if app_user and app_user.preferences and app_user.preferences.reduced_motion else 'false' }});
    } catch (error) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  }());
</script>

<script src="{{ url_for('static', filename='jquery-3.6.3.js') }}"></script>
<script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.0/socket.io.js"></script>
<script src="/static/js/socket-io-updates.js"></script>
<script src="/static/js/mac-spoof.js"></script>
<script src="/static/js/theme-toggle.js"></script>

<title>{{ title }}</title>

{% set navigation = app_navigation(title) if app_navigation is defined else navigation %}
<a class="skip-to-content" href="#main-content">Skip to main content</a>
{% include '_navbar.html' %}
{% include '_navigation_trail.html' %}
