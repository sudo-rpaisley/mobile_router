<div class="modal fade" id="add-device-modal" tabindex="-1" role="dialog" aria-labelledby="add-device-title" aria-hidden="true"><div class="modal-dialog" role="document"><div class="modal-content theme-card"><form method="post" action="/social-engineering/profiles/{{ profile.id }}/devices"><div class="modal-header"><h2 class="modal-title" id="add-device-title">Add device</h2><button class="close" type="button" data-dismiss="modal"><span>&times;</span></button></div><div class="modal-body theme-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="form-group"><label for="device_name">Device name</label><input class="form-control" id="device_name" name="name" placeholder="iPhone 13" required></div><div class="form-group"><label for="device_type">Type and icon</label><select class="form-control" id="device_type" name="device_type"><option value="iphone">iPhone</option><option value="android">Android phone</option><option value="laptop">Laptop</option><option value="desktop">Desktop</option><option value="tablet">Tablet</option><option value="router">Router</option><option value="iot">IoT device</option><option value="other">Other</option></select></div><div class="form-group"><label for="device_mac">MAC address <small class="text-muted">optional</small></label><input class="form-control" id="device_mac" name="mac" placeholder="ac:16:2d:a2:71:9e"></div><div class="form-group"><label for="device_notes">Notes</label><textarea class="form-control" id="device_notes" name="notes" rows="3"></textarea></div></div><div class="modal-footer"><button class="btn btn-outline-secondary" type="button" data-dismiss="modal">Cancel</button><button class="btn btn-primary" type="submit">Save device</button></div></form></div></div></div>

<div class="modal fade" id="add-credential-modal" tabindex="-1" role="dialog" aria-labelledby="add-credential-title" aria-hidden="true"><div class="modal-dialog modal-lg" role="document"><div class="modal-content theme-card"><form id="credential-form" method="post" action="/social-engineering/profiles/{{ profile.id }}/credentials"><div class="modal-header"><div><p class="page-kicker mb-1">Encrypted vault</p><h2 class="modal-title" id="add-credential-title">Add password</h2></div><button class="close" type="button" data-dismiss="modal"><span>&times;</span></button></div><div class="modal-body theme-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" id="secret_ciphertext" name="secret_ciphertext"><div class="form-group"><label for="credential_kind">Used for</label><select class="form-control" id="credential_kind" name="credential_kind"><option value="unassigned">Something — purpose unknown for now</option><option value="website">Website or online account</option><option value="device">Device password or PIN</option></select></div><div class="social-profile-editor-grid"><div class="form-group"><label for="credential_label">Name</label><input class="form-control" id="credential_label" name="label" placeholder="Password found in notes" required></div><div class="form-group"><label for="credential_purpose">Purpose or reminder</label><input class="form-control" id="credential_purpose" name="purpose" placeholder="What might this be used for?"></div><div class="form-group"><label for="credential_url">Website <small class="text-muted">optional</small></label><input class="form-control" type="url" id="credential_url" name="website_url" placeholder="https://example.com"></div><div class="form-group"><label for="credential_device">Device <small class="text-muted">optional</small></label><select class="form-control" id="credential_device" name="device_id"><option value="">No linked device</option>{% for device in profile.devices %}<option value="{{ device.id }}">{{ device.name }}</option>{% endfor %}</select></div><div class="form-group"><label for="credential_username">Username or email</label><input class="form-control" id="credential_username" name="username" autocomplete="off"></div><div class="form-group"><label for="credential_secret">Password, PIN, or secret</label><input class="form-control" type="password" id="credential_secret" autocomplete="new-password"></div></div><div class="form-group"><label for="credential_notes">Private notes</label><textarea class="form-control" id="credential_notes" name="credential_notes" rows="3"></textarea></div><p class="text-muted small"><i class="fas fa-shield-alt"></i> The secret is encrypted in this browser before it is sent to Mobile Router.</p></div><div class="modal-footer"><button class="btn btn-outline-secondary" type="button" data-dismiss="modal">Cancel</button><button class="btn btn-primary" type="submit">Encrypt and save</button></div></form></div></div></div>
