<div class="modal fade" id="add-device-modal" tabindex="-1" role="dialog" aria-labelledby="add-device-title" aria-hidden="true"><div class="modal-dialog" role="document"><div class="modal-content theme-card"><form method="post" action="/social-engineering/profiles/{{ profile.id }}/devices"><div class="modal-header"><h2 class="modal-title" id="add-device-title">Add device</h2><button class="close" type="button" data-dismiss="modal"><span>&times;</span></button></div><div class="modal-body theme-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="form-group"><label for="device_name">Device name</label><input class="form-control" id="device_name" name="name" placeholder="iPhone 13" required></div><div class="form-group"><label for="device_type">Type and icon</label><select class="form-control" id="device_type" name="device_type"><option value="iphone">iPhone</option><option value="android">Android phone</option><option value="laptop">Laptop</option><option value="desktop">Desktop</option><option value="tablet">Tablet</option><option value="router">Router</option><option value="iot">IoT device</option><option value="other">Other</option></select></div><div class="form-group"><label for="device_inventory_mac">Choose a discovered device</label><select class="form-control" id="device_inventory_mac" name="inventory_mac"><option value="">No inventory match</option>{% for item in inventory_choices %}{% set item_mac = item.mac or item.address %}<option value="{{ item_mac }}">{{ item.display_name or item.name or item.ip or item_mac }} — {{ item_mac }}</option>{% endfor %}</select></div><div class="form-group"><label for="device_mac">Or enter a MAC address</label><input class="form-control" id="device_mac" name="mac" placeholder="ac:16:2d:a2:71:9e"></div><div class="form-group"><label for="device_notes">Notes</label><textarea class="form-control" id="device_notes" name="notes" rows="3"></textarea></div></div><div class="modal-footer"><button class="btn btn-outline-secondary" type="button" data-dismiss="modal">Cancel</button><button class="btn btn-primary" type="submit">Save device</button></div></form></div></div></div>

<div class="modal fade" id="add-credential-modal" tabindex="-1" role="dialog" aria-labelledby="add-credential-title" aria-hidden="true"><div class="modal-dialog modal-lg" role="document"><div class="modal-content theme-card"><form id="credential-form" method="post" action="/social-engineering/profiles/{{ profile.id }}/credentials"><div class="modal-header"><div><p class="page-kicker mb-1">Encrypted vault</p><h2 class="modal-title" id="add-credential-title">Add password</h2></div><button class="close" type="button" data-dismiss="modal"><span>&times;</span></button></div><div class="modal-body theme-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" id="secret_ciphertext" name="secret_ciphertext"><div class="form-group"><label for="credential_kind">Used for</label><select class="form-control" id="credential_kind" name="credential_kind"><option value="unassigned">Something — purpose unknown for now</option><option value="website">Website or online account</option><option value="device">Device password or PIN</option></select></div><div class="social-profile-editor-grid"><div class="form-group"><label for="credential_label">Name</label><input class="form-control" id="credential_label" name="label" placeholder="Password found in notes" required></div><div class="form-group"><label for="credential_purpose">Purpose or reminder</label><input class="form-control" id="credential_purpose" name="purpose" placeholder="What might this be used for?"></div><div class="form-group"><label for="credential_url">Website <small class="text-muted">optional</small></label><input class="form-control" type="url" id="credential_url" name="website_url" placeholder="https://example.com"></div><div class="form-group"><label for="credential_device">Device <small class="text-muted">optional</small></label><select class="form-control" id="credential_device" name="device_id"><option value="">No linked device</option>{% for device in profile.devices %}<option value="{{ device.id }}">{{ device.name }}</option>{% endfor %}</select></div><div class="form-group"><label for="credential_username">Username or email</label><input class="form-control" id="credential_username" name="username" autocomplete="off"></div><div class="form-group"><label for="credential_secret">Password, PIN, or secret</label><input class="form-control" type="password" id="credential_secret" autocomplete="new-password"></div></div><div class="form-group"><label for="credential_notes">Private notes</label><textarea class="form-control" id="credential_notes" name="credential_notes" rows="3"></textarea></div><p class="text-muted small"><i class="fas fa-shield-alt"></i> The secret is encrypted in this browser before it is sent to Mobile Router.</p></div><div class="modal-footer"><button class="btn btn-outline-secondary" type="button" data-dismiss="modal">Cancel</button><button class="btn btn-primary" type="submit">Encrypt and save</button></div></form></div></div></div>

<div class="modal fade" id="edit-device-modal" tabindex="-1" role="dialog" aria-labelledby="edit-device-title" aria-hidden="true"><div class="modal-dialog modal-lg" role="document"><div class="modal-content theme-card"><form id="edit-device-form" method="post"><div class="modal-header"><h2 class="modal-title" id="edit-device-title">Edit device</h2><button class="close" type="button" data-dismiss="modal"><span>&times;</span></button></div><div class="modal-body theme-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="social-profile-editor-grid"><div class="form-group"><label for="edit_device_name">Name</label><input class="form-control" id="edit_device_name" name="name" required></div><div class="form-group"><label for="edit_device_type">Type</label><select class="form-control" id="edit_device_type" name="device_type"><option value="iphone">iPhone</option><option value="android">Android</option><option value="laptop">Laptop</option><option value="desktop">Desktop</option><option value="tablet">Tablet</option><option value="router">Router</option><option value="iot">IoT</option><option value="other">Other</option></select></div><div class="form-group"><label for="edit_device_inventory">Discovered inventory match</label><select class="form-control" id="edit_device_inventory" name="inventory_mac"><option value="">No inventory match</option>{% for item in inventory_choices %}{% set item_mac = item.mac or item.address %}<option value="{{ item_mac }}">{{ item.display_name or item.name or item.ip or item_mac }} — {{ item_mac }}</option>{% endfor %}</select></div><div class="form-group"><label for="edit_device_mac">Or MAC address</label><input class="form-control" id="edit_device_mac" name="mac"></div><div class="form-group"><label for="edit_device_manufacturer">Manufacturer</label><input class="form-control" id="edit_device_manufacturer" name="manufacturer"></div><div class="form-group"><label for="edit_device_model">Model</label><input class="form-control" id="edit_device_model" name="model"></div><div class="form-group"><label for="edit_device_os">Operating system</label><input class="form-control" id="edit_device_os" name="operating_system"></div><div class="form-group"><label for="edit_device_hostname">Hostname</label><input class="form-control" id="edit_device_hostname" name="hostname"></div><div class="form-group"><label for="edit_device_status">Status</label><select class="form-control" id="edit_device_status" name="device_status"><option>active</option><option>offline</option><option>lost</option><option>stolen</option><option>retired</option><option>shared</option><option>unknown</option></select></div></div><div class="form-group"><label for="edit_device_notes">Notes</label><textarea class="form-control" id="edit_device_notes" name="notes"></textarea></div></div><div class="modal-footer"><button class="btn btn-outline-secondary" type="button" data-dismiss="modal">Cancel</button><button class="btn btn-primary" type="submit">Save device</button></div></form></div></div></div>

<div class="modal fade" id="edit-credential-modal" tabindex="-1" role="dialog" aria-labelledby="edit-credential-title" aria-hidden="true"><div class="modal-dialog modal-lg" role="document"><div class="modal-content theme-card"><form id="credential-edit-form" method="post"><div class="modal-header"><h2 class="modal-title" id="edit-credential-title">Edit or rotate password</h2><button class="close" type="button" data-dismiss="modal"><span>&times;</span></button></div><div class="modal-body theme-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" id="edit_secret_ciphertext" name="secret_ciphertext"><div class="social-profile-editor-grid"><div class="form-group"><label for="edit_credential_kind">Used for</label><select class="form-control" id="edit_credential_kind" name="credential_kind"><option value="unassigned">Purpose unknown</option><option value="website">Website</option><option value="device">Device</option></select></div><div class="form-group"><label for="edit_credential_label">Name</label><input class="form-control" id="edit_credential_label" name="label" required></div><div class="form-group"><label for="edit_credential_purpose">Purpose</label><input class="form-control" id="edit_credential_purpose" name="purpose"></div><div class="form-group"><label for="edit_credential_url">Website</label><input class="form-control" id="edit_credential_url" name="website_url"></div><div class="form-group"><label for="edit_credential_device">Device</label><select class="form-control" id="edit_credential_device" name="device_id"><option value="">No linked device</option>{% for device in profile.devices %}<option value="{{ device.id }}">{{ device.name }}</option>{% endfor %}</select></div><div class="form-group"><label for="edit_credential_username">Username</label><input class="form-control" id="edit_credential_username" name="username"></div><div class="form-group"><label for="edit_credential_secret">New password <small class="text-muted">leave blank to keep current</small></label><input class="form-control" type="password" id="edit_credential_secret" autocomplete="new-password"></div></div><div class="form-group"><label for="edit_credential_notes">Private notes</label><textarea class="form-control" id="edit_credential_notes" name="credential_notes"></textarea></div></div><div class="modal-footer"><button class="btn btn-outline-secondary" type="button" data-dismiss="modal">Cancel</button><button class="btn btn-primary" type="submit">Save changes</button></div></form></div></div></div>

<div class="modal fade" id="add-relationship-modal" tabindex="-1" role="dialog" aria-labelledby="add-relationship-title" aria-hidden="true"><div class="modal-dialog" role="document"><div class="modal-content theme-card"><form method="post" action="/social-engineering/profiles/{{ profile.id }}/relationships"><div class="modal-header"><h2 id="add-relationship-title" class="modal-title">Add relationship</h2><button class="close" type="button" data-dismiss="modal"><span>&times;</span></button></div><div class="modal-body theme-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="form-group"><label for="relationship_target">Individual</label><select class="form-control" id="relationship_target" name="target_profile_id" required><option value="">Choose contact</option>{% for person in relationship_choices %}<option value="{{ person.id }}">{{ person.full_name }}</option>{% endfor %}</select></div><div class="form-group"><label for="relationship_type">Relationship</label><input class="form-control" id="relationship_type" name="relationship" placeholder="Manager, coworker, family..." required></div><div class="form-group"><label for="relationship_notes">Notes</label><input class="form-control" id="relationship_notes" name="notes"></div></div><div class="modal-footer"><button class="btn btn-outline-secondary" type="button" data-dismiss="modal">Cancel</button><button class="btn btn-primary">Save relationship</button></div></form></div></div></div>

<div class="modal fade" id="add-attachment-modal" tabindex="-1" role="dialog" aria-labelledby="add-attachment-title" aria-hidden="true"><div class="modal-dialog" role="document"><div class="modal-content theme-card"><form method="post" action="/social-engineering/profiles/{{ profile.id }}/attachments" enctype="multipart/form-data"><div class="modal-header"><h2 id="add-attachment-title" class="modal-title">Attach evidence</h2><button class="close" type="button" data-dismiss="modal"><span>&times;</span></button></div><div class="modal-body theme-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="form-group"><label for="attachment_file">File (10 MB maximum)</label><input class="form-control-file" id="attachment_file" type="file" name="attachment" required></div><div class="form-group"><label for="attachment_description">Description</label><input class="form-control" id="attachment_description" name="description"></div><p class="text-muted small">Attachments are stored locally and checksummed. Do not upload material you are not authorized to retain.</p></div><div class="modal-footer"><button class="btn btn-outline-secondary" type="button" data-dismiss="modal">Cancel</button><button class="btn btn-primary">Attach file</button></div></form></div></div></div>
